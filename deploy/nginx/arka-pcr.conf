# =============================================================================
# Nginx — ARKA PCR upstream (subpath /arka-pcr)
# =============================================================================
# Pasang di server sebagai:
#   /home/skyone/stack/nginx/conf.d/arka-pcr.conf
#
# Routing publik: tambahkan blok di deploy/nginx/arka-pcr-site-locations.snippet
# ke dalam server { } utama (site.conf), BUKAN server block terpisah di port 80.
#
# Setelah perubahan:
#   docker compose exec nginx nginx -t
#   docker compose exec nginx nginx -s reload
# =============================================================================

upstream arka_pcr_upstream {
    server arka-pcr:3000;
    keepalive 32;
}
