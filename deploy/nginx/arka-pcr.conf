# =============================================================================
# Nginx reverse proxy — ARKA PCR (Next.js)
# =============================================================================
# Pasang di server sebagai:
#   /home/skyone/stack/nginx/conf.d/arka-pcr.conf
#
# Volume nginx (sudah ada di stack):
#   ./nginx/conf.d:/etc/nginx/conf.d:ro
#
# Setelah file ini ditambahkan:
#   docker compose exec nginx nginx -t
#   docker compose exec nginx nginx -s reload
#
# Ganti server_name sesuai hostname/IP produksi Anda.
# Jika belum ada TLS, gunakan blok HTTP saja (di bawah).
# =============================================================================

upstream arka_pcr_upstream {
    # Nama service di docker-compose (network appnet)
    server arka-pcr:3000;
    keepalive 32;
}

server {
    listen 80;
    # Contoh: pcr.arka.local  atau  IP internal
    server_name pcr.example.local;

    client_max_body_size 12m;

    # Next.js trailingSlash: true — biarkan path apa adanya
    location / {
        proxy_pass http://arka_pcr_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer untuk halaman admin Vuexy yang relatif besar
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
    }

    # Health / static bisa di-cache singkat jika diperlukan nanti
    location /_next/static/ {
        proxy_pass http://arka_pcr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

