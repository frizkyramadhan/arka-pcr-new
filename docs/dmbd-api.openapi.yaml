openapi: 3.0.3
info:
  title: ARKA PCR DMBD API
  version: '1.0'
  description: |
    Read-only Daily Monitoring Breakdown API for other applications.
    Auth: Bearer API token (System → API Tokens). Permission: breakdown.read.
    Docs: docs/dmbd-api.md
servers:
  - url: /api/v1/dmbd
    description: Relative to APP_URL (include base path if any)
security:
  - bearerAuth: []
paths:
  /meta/:
    get:
      summary: Reference data (sites, filters, endpoints)
      operationId: dmbdMeta
      responses:
        '200':
          description: Meta payload
        '401':
          description: Unauthorized
  /kpi/:
    get:
      summary: DMBD dashboard KPI (same as /dashboards/dmbd)
      operationId: dmbdKpi
      parameters:
        - name: site
          in: query
          schema: { type: string, default: ALL }
        - name: period
          in: query
          schema: { type: string, example: '2026-11' }
        - name: view
          in: query
          schema: { type: string, enum: [MTD, YTD] }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: plant
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [breakdown, waiting_part, under_repair, ready]
      responses:
        '200':
          description: KPI + rows
  /breakdowns/:
    get:
      summary: Paginated breakdown list
      operationId: dmbdBreakdowns
      parameters:
        - name: site
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [open, closed, cancelled] }
        - name: position
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
      responses:
        '200':
          description: List page
  /breakdowns/{id}/:
    get:
      summary: Breakdown detail + activities
      operationId: dmbdBreakdownDetail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detail
        '404':
          description: Not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: arka_…
